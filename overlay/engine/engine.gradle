def engineRoot = file('../../extera-plugins/engine')
def enginePython = System.getenv('CHAQUOPY_BUILD_PYTHON') ?: System.getenv('BUILD_PYTHON') ?: (
    System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows') ? 'py' : 'python3.11'
)
def pythonCommand = enginePython == 'py' ? ['py', '-3.11'] : [enginePython]

if (!android.hasProperty('compileSdkVersion')) {
    android.metaClass.getCompileSdkVersion = { -> "android-${android.compileSdk}" }
}

android.sourceSets.main.java.srcDir new File(engineRoot, 'java')
android.compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
}
tasks.withType(JavaCompile).configureEach {
    sourceCompatibility = JavaVersion.VERSION_17.toString()
    targetCompatibility = JavaVersion.VERSION_17.toString()
}
tasks.matching { it.name.contains("Kotlin") }.configureEach {
    try {
        kotlinOptions {
            jvmTarget = "17"
        }
    } catch (Throwable ignored) {}
}
android.buildTypes.configureEach {
    proguardFile new File(engineRoot, 'proguard-rules.pro')
}
android.packaging.jniLibs.pickFirsts.add('**/liblsplant.so')
android.packaging.jniLibs.pickFirsts.add('**/libshadowhook.so')

tasks.matching { it.name ==~ /check\w+AarMetadata/ }.configureEach {
    enabled = false
}

afterEvaluate {
    def abis = android.defaultConfig.ndk.abiFilters.sort(false)
    if (abis.isEmpty() || abis.any { !(it in ['arm64-v8a', 'x86_64']) }) {
        throw new GradleException('Python plugins require ABI_FILTERS=arm64-v8a or x86_64')
    }
}

abstract class EntinyPythonSdkTask extends Exec {
    @OutputDirectory
    abstract DirectoryProperty getAssetsDir()
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def variantName = variant.name.capitalize()
        def abis = android.defaultConfig.ndk.abiFilters.sort(false)
        if (abis.isEmpty()) abis = ['arm64-v8a']
        def isBeta = variant.name.toLowerCase(Locale.ROOT).contains('beta') || variant.name.toLowerCase(Locale.ROOT).contains('debug')
        def buildSdkTask = tasks.register("buildPythonSdk${variantName}", EntinyPythonSdkTask) {
            assetsDir.set(layout.buildDirectory.dir("generated/plugins/pysdk/${variant.name}"))
            inputs.dir(new File(engineRoot, 'pysdk/src'))
            inputs.file(new File(engineRoot, 'pysdk/tools/build_sdk.py'))
            doFirst {
                def cmd = pythonCommand + [
                    new File(engineRoot, 'pysdk/tools/build_sdk.py').absolutePath,
                    '--out', assetsDir.get().asFile.absolutePath,
                    '--channel', isBeta ? 'beta' : 'stable',
                    '--python', '3.11'
                ] + abis.collectMany { ['--abi', it] }
                commandLine cmd
            }
        }
        variant.sources.assets?.addGeneratedSourceDirectory(buildSdkTask, { it.assetsDir })
    }
}

gradle.taskGraph.whenReady { graph ->
    graph.allTasks.findAll { it.project == project && it.name ==~ /install\w+PythonRequirements/ }.each { task ->
        task.doLast {
            project.fileTree(task.outputDir.get().asFile) {
                include '**/*.pdb', '**/*.exe', '**/*.dll', '**/*.pyd', '**/*.dylib'
                include '**/*.c', '**/*.h', '**/*.hpp', '**/*.pyx', '**/*.pxd', '**/*.pxi'
                include '**/winappdbg/**'
            }.each { it.delete() }
        }
    }
}

// entiny: exteraGram plugins ship native libs linked against the shared STL, stock builds only c++_static
def stlRoot = layout.buildDirectory.dir('exteraStl').get().asFile
android.sourceSets.main.jniLibs.srcDirs += stlRoot
afterEvaluate {
    def stlAbis = android.defaultConfig.ndk.abiFilters.sort(false)
    def stlTask = tasks.register('copyEntinySharedStl') {
        doLast {
            def triples = ['arm64-v8a': 'aarch64-linux-android', 'x86_64': 'x86_64-linux-android']
            def ndk = androidComponents.sdkComponents.ndkDirectory.get().asFile
            stlAbis.each { abi ->
                def source = fileTree(ndk) {
                    include "toolchains/llvm/prebuilt/*/sysroot/usr/lib/${triples[abi]}/libc++_shared.so"
                }.files.find { true }
                if (source == null) throw new GradleException("libc++_shared.so not found for ${abi}")
                copy { from source; into new File(stlRoot, abi) }
            }
        }
    }
    tasks.matching { it.name ==~ /merge.*JniLibFolders/ }.configureEach { dependsOn stlTask }
}
