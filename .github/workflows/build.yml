name: Build APK

on:
  workflow_dispatch:
    inputs:
      abi:
        description: Target ABI
        required: false
        default: arm64-v8a
        type: choice
        options:
          - arm64-v8a
          - x86_64
      build_type:
        description: Build type
        required: false
        default: release
        type: choice
        options:
          - release
          - beta
          - debug
      host_ref:
        description: Optional entinyGram/android ref (defaults to manifest/sources.json host.commit)
        required: false
        default: ''
        type: string
      publish_release:
        description: Publish APK to GitHub Releases
        required: false
        default: true
        type: boolean

concurrency:
  group: build-apk-${{ github.ref }}-${{ inputs.abi || 'arm64-v8a' }}-${{ inputs.build_type || 'release' }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build APK (${{ inputs.abi || 'arm64-v8a' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true

      - name: Checkout overlay
        uses: actions/checkout@v4
        with:
          path: extera-src

      - name: Resolve entinyGram host commit
        id: host
        env:
          INPUT_HOST_REF: ${{ inputs.host_ref }}
        run: |
          if [ -n "$INPUT_HOST_REF" ]; then
            ref="$INPUT_HOST_REF"
          else
            ref=$(jq -r '.host.commit // "main"' extera-src/manifest/sources.json)
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Using entinyGram/android ref: $ref"

      - name: Checkout entinyGram host
        uses: actions/checkout@v4
        with:
          repository: entinyGram/android
          ref: ${{ steps.host.outputs.ref }}
          path: entinygram
          fetch-depth: 0

      - name: Mount overlay into entinygram/extera-plugins
        run: |
          rm -rf entinygram/extera-plugins
          mv extera-src entinygram/extera-plugins

      - name: Configure git identity
        run: |
          git config --global user.email ci@entinygram
          git config --global user.name 'entinygram ci'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: entinygram/package.json

      - name: Install JS dependencies
        working-directory: entinygram
        run: bun install --frozen-lockfile

      - name: Run overlay unit tests
        working-directory: entinygram
        run: bun test extera-plugins/tests

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          append-timestamp: true
          key: ${{ runner.os }}-ndk-27.2-extera-${{ inputs.abi || 'arm64-v8a' }}-${{ inputs.build_type || 'release' }}
          restore-keys: |
            ${{ runner.os }}-ndk-27.2-extera-${{ inputs.abi || 'arm64-v8a' }}-
            ${{ runner.os }}-ndk-27.2-extera-
            ${{ runner.os }}-
          max-size: 5G
          verbose: 2
          save: true

      - name: Set up entinyGram worktree
        working-directory: entinygram
        run: bun run setup -- --ci

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            GOOGLE_SERVICES_JSON=$(cat <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "entinygram-ci-placeholder",
              "storage_bucket": "entinygram-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "ua.entaytion.entinygram"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyPlaceholderKeyForBuildOnly0000000"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON
            )
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > entinygram/worktree/TMessagesProj/google-services.json
          printf '%s' "$GOOGLE_SERVICES_JSON" > entinygram/worktree/TMessagesProj_App/google-services.json

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: always

      - name: Cache Android NDK & CMake
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
            ${{ env.ANDROID_HOME }}/cmake/3.31.6
            ${{ env.ANDROID_HOME }}/cmake/3.22.1
          key: android-ndk-cmake-27.2.12479018-3.31.6-3.22.1

      - uses: android-actions/setup-android@v4
        with:
          packages: >-
            platforms;android-36
            build-tools;36.0.0
            platforms;android-35
            build-tools;35.0.0
            cmake;3.31.6
            cmake;3.22.1
            ndk;27.2.12479018

      - name: Tune Gradle
        run: |
          mkdir -p ~/.gradle
          {
            echo 'org.gradle.caching=true'
            echo 'org.gradle.parallel=true'
            echo 'org.gradle.jvmargs=-Xmx8192m -Dfile.encoding=UTF-8 -XX:+UseParallelGC'
            echo 'android.native.buildOutput=verbose'
          } >> ~/.gradle/gradle.properties

      - name: Install libclang
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo sed -i -E 's|^URIs: mirror\+file:/etc/apt/apt-mirrors.txt|URIs: http://archive.ubuntu.com/ubuntu/|' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|' /etc/apt/sources.list 2>/dev/null || true
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=20"
          ok=0
          for i in 1 2 3; do
            if sudo -E timeout 120 apt-get $APT_OPTS update -qq && sudo -E timeout 180 apt-get $APT_OPTS install -y --no-install-recommends libclang-dev; then
              ok=1
              break
            fi
            echo "apt attempt $i failed"
            sleep 5
          done
          if [ "$ok" != 1 ]; then
            echo "apt failed, falling back to the pip libclang wheel"
            python3 -m pip install --user --break-system-packages libclang
            echo "LIBCLANG_PATH=$(python3 -c 'import clang, os; print(os.path.join(os.path.dirname(clang.__file__), "native"))')" >> "$GITHUB_ENV"
          fi

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            entinygram/src/native/target
          key: ${{ runner.os }}-cargo-extera-${{ hashFiles('entinygram/src/native/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-extera-

      - name: Install Android Rust toolchain
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked --force

      - name: Install wallet engine Rust targets
        working-directory: entinygram/worktree/TMessagesProj/jni/gram-wallet
        run: rustup target add aarch64-linux-android armv7-linux-androideabi

      - name: Preflight overlay check
        working-directory: entinygram
        run: bun extera-plugins/apply.ts --check

      - name: Configure build version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p entinygram/extera-plugins/var
          today=$(date -u +%Y%m%d)
          latest_today=$(gh release list -R "$GITHUB_REPOSITORY" --limit 50 --json tagName \
            -q ".[].tagName" | grep -oE "${today}[0-9]{2}" | sort | tail -n1 || true)
          if [ -n "$latest_today" ]; then
            prev="$latest_today"
          else
            prev="2020010100"
          fi
          printf 'build version: "%s"\n' "$prev" > entinygram/extera-plugins/var/config.yaml
          cat entinygram/extera-plugins/var/config.yaml

      - name: Reset ccache stats
        run: ccache -z

      - name: Build APK
        id: build
        working-directory: entinygram
        env:
          COMMIT_ID: ${{ github.sha }}
          CCACHE_COMPILERCHECK: content
          CCACHE_SLOPPINESS: time_macros,file_macro,include_file_mtime,include_file_ctime,locale,system_headers
          CCACHE_BASEDIR: ${{ github.workspace }}/entinygram/worktree
        run: |
          export CHAQUOPY_BUILD_PYTHON="$(command -v python3.11)"
          bun extera-plugins/build.ts \
            --build-type "${{ inputs.build_type || 'release' }}" \
            --abi "${{ inputs.abi || 'arm64-v8a' }}"
          apk=$(find extera-plugins/var/out -maxdepth 1 -type f -name 'entinygram-private-*.apk' | head -n1)
          if [ -z "$apk" ] || [ ! -f "$apk" ]; then
            echo "::error::Built APK not found in extera-plugins/var/out"
            exit 1
          fi
          ver=$(sed -nE 's/^build version:[[:space:]]*"?([0-9]{10})"?.*$/\1/p' extera-plugins/var/config.yaml)
          app_ver=$(sed -nE 's/^APP_VERSION_NAME[[:space:]]*=[[:space:]]*([a-zA-Z0-9._-]+).*$/\1/p' worktree/gradle.properties)
          echo "apk_path=$PWD/$apk" >> "$GITHUB_OUTPUT"
          echo "apk_name=$(basename "$apk")" >> "$GITHUB_OUTPUT"
          echo "build_version=$ver" >> "$GITHUB_OUTPUT"
          echo "app_version=$app_ver" >> "$GITHUB_OUTPUT"

      - name: Show ccache stats
        if: always()
        run: ccache -s -v

      - name: Sign and verify APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          apk="${{ steps.build.outputs.apk_path }}"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          if [ -n "$KEYSTORE_BASE64" ]; then
            umask 077
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            "$apksigner" sign \
              --ks "$RUNNER_TEMP/release.keystore" \
              --ks-key-alias "${KEY_ALIAS:-mrtv}" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" \
              --v1-signing-enabled false \
              --in "$apk" \
              --out "$apk.signed"
            mv "$apk.signed" "$apk"
            rm -f "$RUNNER_TEMP/release.keystore"
          fi
          "$apksigner" verify --print-certs "$apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.apk_name }}
          path: ${{ steps.build.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: ${{ inputs.publish_release != false && inputs.publish_release != 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="${{ steps.build.outputs.apk_path }}"
          ver="${{ steps.build.outputs.build_version }}"
          app_ver="${{ steps.build.outputs.app_version }}"
          abi="${{ inputs.abi || 'arm64-v8a' }}"
          build_type="${{ inputs.build_type || 'release' }}"
          tag="v${app_ver}-${ver}"
          {
            echo "## entinyGram + extera ($tag)"
            echo ""
            echo "- **Version:** \`${app_ver}\` (\`${ver}\`)"
            echo "- **Build type:** \`${build_type}\`"
            echo "- **ABI:** \`${abi}\`"
            echo "- **Overlay commit:** \`${GITHUB_SHA}\`"
            echo "- **Host commit:** \`${{ steps.host.outputs.ref }}\`"
          } > release_notes.md
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes-file release_notes.md \
            "$apk"
